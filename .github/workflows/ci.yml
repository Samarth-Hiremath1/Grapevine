name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked environment (core + dev, Python from .python-version)
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: .venv/bin/ruff check grapevine tests studies

      - name: Type check (mypy)
        run: .venv/bin/mypy

      - name: Results and the Validity Card regenerate byte-identically
        run: |
          .venv/bin/python -m studies.underspecification.reproduce
          git diff --exit-code -- \
            studies/underspecification/figures/results_tables.json \
            studies/underspecification/figures/accuracy_by_condition.csv \
            studies/underspecification/validity_card.json \
            studies/underspecification/validity_card.md

      - name: hidden_profile_v2's Validity Card regenerates byte-identically
        run: |
          .venv/bin/grapevine audit hidden_profile_v2 --n 200 --seed 0 \
            --out environments/hidden_profile_v2
          git diff --exit-code -- environments/hidden_profile_v2

      - name: Study prompts still match the committed runs
        run: .venv/bin/python -m studies.underspecification.freeze_prompts --check

      - name: Quickstart works with no API key
        run: |
          .venv/bin/grapevine envs
          # Exits 2 because hidden_profile genuinely fails its audit; that is the
          # finding the quickstart is meant to show, so a 0 here would be the bug.
          .venv/bin/grapevine audit hidden_profile --n 50 > /dev/null && exit 1 || test $? -eq 2

      - name: Core stays light (grapevine.rl imports no torch)
        run: |
          .venv/bin/python - <<'EOF'
          import importlib.util, sys
          assert importlib.util.find_spec("torch") is None, "core install pulled in torch"
          import grapevine, grapevine.rl, grapevine.rl.grpo, grapevine.rl.eval  # noqa: F401
          heavy = [m for m in ("torch", "transformers", "trl", "peft") if m in sys.modules]
          assert not heavy, f"importing grapevine.rl loaded {heavy}"
          EOF

      - name: Tests on the core install (model-loading tests skip)
        run: .venv/bin/pytest -q

  rl-smoke:
    # GRPO integration, smoke-tested. These runs prove the loop is wired and that
    # frozen partners stay frozen; they are not training and report no results.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked environment with the [rl] extra (CPU torch on Linux)
        run: uv sync --locked --extra dev --extra rl

      - name: GRPO smoke run, isolation test and its negative control
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: .venv/bin/pytest -q tests/test_rl_training.py

      - name: The shipped smoke config runs through the CLI
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          .venv/bin/grapevine train configs/rl_smoke_cpu.yaml
          .venv/bin/python - <<'EOF'
          import json
          m = json.load(open("runs/rl_smoke_cpu/manifest.json"))
          assert m["global_step"] == 2, m["global_step"]
          assert m["reportable"] is False and m["synthetic"] is True
          assert m["partners_frozen"] is True
          EOF

      - name: The GPU config passes the audit gate (dry run, no model)
        run: .venv/bin/grapevine train configs/rl_single_gpu.yaml --dry-run
