name: Release

# Not triggered in v0.2. It runs only when a tag like `v0.2.0` is pushed, and
# the publish job additionally needs, set up by the maintainer on GitHub and on
# PyPI and not by this file:
#   - a GitHub environment named `pypi` (ideally with a required reviewer);
#   - a PyPI trusted publisher for project `grapevine-mas`, this repository,
#     this workflow file and that environment.
# Until both exist the publish job fails without uploading anything.
#
# Actions are pinned by commit SHA (resolved 2026-11-16). The publish step
# follows pypa/gh-action-pypi-publish v1.14.3's README: build in a separate job,
# hand the files over as an artifact, and grant `id-token: write` to the
# publish job only.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1; }

      - name: Full test suite on the locked environment
        run: |
          uv sync --locked --extra dev
          uv run --no-sync pytest -q

      - name: Build and check
        run: |
          uv build
          uvx twine@7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/grapevine-mas
    permissions:
      id-token: write  # trusted publishing; no token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
