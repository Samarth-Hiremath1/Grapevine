# Every registered number in the prose, with where it comes from.
#
#   grapevine verify-claims          # CI and tests/test_claims.py run this
#
# Each claim renders `template` from its source and must appear verbatim in
# `file` (whitespace and minus signs normalised). Sources are committed files
# or deterministic functions in this repository; see grapevine/claims.py.
#
# Not yet registered, and therefore not machine-checked: the surfacing metric's
# precision, recall and label count (README "Limitations", docs/audit.md L5) --
# recall depends on pool sizes no committed file stores, and who produced the
# labels is an open question (docs/review-v0.2-response.md, M5); "12 fact sentences"
# and the support pattern (6, 5, 1, 0) in the README; the HiddenBench figures,
# which come from the paper, not from a run.

v0_tables: &v0 studies/underspecification/figures/results_tables.json
v0_card: &v0card studies/underspecification/validity_card.json
v2_card: &v2card environments/hidden_profile_v2/validity_card.json
v2_results: &v2r studies/v2_eval/runs/20261116T091238Z_primary/results.json
v2_primary: &v2p studies/v2_eval/runs/20261116T091238Z_primary/manifest.json
v2_pilot: &v2pilot studies/v2_eval/runs/20261116T074017Z_pilot/manifest.json

claims:
