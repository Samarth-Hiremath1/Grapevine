# Built with `uv run mkdocs build --strict`; CI fails on any warning.
# Versions pinned in pyproject.toml's `docs` extra (read 2026-11-16).
site_name: Grapevine
site_description: Check whether a multi-agent LLM eval or RL environment measures coordination.
repo_url: https://github.com/Samarth-Hiremath1/Grapevine
repo_name: Samarth-Hiremath1/Grapevine
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: info

# results.md embeds a figure from studies/, outside docs/; it is read on GitHub,
# where that relative path resolves, and linked from the site instead.
exclude_docs: |
  /results.md

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Writing an environment: writing-an-environment.md
  - The audit battery: audit-battery.md
  - RL and GRPO: rl.md
  - API reference: api.md
  - Case studies:
      - "v0: the audit that started it": audit.md
      - "v0: assumption ledger": assumptions.md
      - "v0: methodology": methodology.md
      - "v0: experiment": experiment.md
      - "v0.2: pre-registered eval": prereg/hidden_profile_v2_eval.md
  - Project:
      - Changelog: changelog.md
      - Decisions: decisions.md
      - Progress log: PROGRESS.md
      - v0.2 plan: v0.2-plan.md
      - "Notes: NeMo-RL": notes/nemo_rl.md
